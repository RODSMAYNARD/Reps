<style>
/* Layout: barra fixa com seções + grade de celulares; cada cartão traz suas ações embaixo. */
:root {
  --bg: #EEF1F6; --panel: #FFFFFF; --ink: #0E1116; --sub: #5B6472; --line: #D9DEE7; --accent: #0A84FF; --danger: #E5484D; --fav: #F5A524;
  --display: "Space Grotesk", "Inter", system-ui, sans-serif; --body: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #0C0F14; --panel: #161B23; --ink: #EEF1F6; --sub: #96A0AF; --line: #262E3A; --accent: #3D9BFF; color-scheme: dark } }
:root[data-theme="dark"] { --bg: #0C0F14; --panel: #161B23; --ink: #EEF1F6; --sub: #96A0AF; --line: #262E3A; --accent: #3D9BFF; color-scheme: dark }
[hidden] { display: none !important; }
body { background: var(--bg); color: var(--ink); font-family: var(--body); margin: 0; }
* { box-sizing: border-box; }
.wrap { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 0 48px; max-width: 1500px; margin: 0 auto; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
header.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); padding-block: 14px 10px; display: flex; flex-direction: column; gap: 10px; border-bottom: 1px solid var(--line); }
.brand { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.brand h1 { font-family: var(--display); font-size: 26px; margin: 0; letter-spacing: -0.02em; }
.brand p { margin: 0; color: var(--sub); font-size: 13px; }
.tabs { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; }
.tab { border: 1px solid var(--line); background: var(--panel); color: var(--ink); border-radius: 999px; padding: 8px 14px; font: 600 14px var(--body); cursor: pointer; white-space: nowrap; display: inline-flex; gap: 8px; align-items: center; }
.tab .n { font-size: 12px; color: var(--sub); font-weight: 600; }
.tab[aria-selected="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.tab[aria-selected="true"] .n { color: var(--bg); opacity: .7; }
.tools { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; font-size: 13px; color: var(--sub); }
.tools label { display: inline-flex; gap: 8px; align-items: center; }
.tools input[type=range] { width: 130px; accent-color: var(--accent); }
.tbtn { border: 1px solid var(--line); background: var(--panel); color: var(--ink); border-radius: 10px; padding: 7px 11px; font: 600 13px var(--body); cursor: pointer; display: inline-flex; gap: 6px; align-items: center; }
.tbtn:hover { border-color: var(--accent); }
.tbtn.on { background: var(--fav); border-color: var(--fav); color: #111; }
.sec-intro { margin: 18px 0 6px; display: flex; flex-direction: column; gap: 4px; }
.sec-intro h2 { font-family: var(--display); font-size: 21px; margin: 0; }
.sec-intro p { margin: 0; color: var(--sub); max-width: 70ch; font-size: 14px; line-height: 1.5; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(calc(var(--z) * 300px + 28px), 1fr)); gap: 22px; margin-top: 14px; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 22px; padding: 14px; display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.card.fav { border-color: var(--fav); box-shadow: 0 0 0 2px color-mix(in srgb, var(--fav) 35%, transparent); }
.card.editing { border-color: var(--accent); box-shadow: 0 0 0 2px color-mix(in srgb, var(--accent) 30%, transparent); }
.meta { display: flex; justify-content: space-between; gap: 8px; align-items: flex-start; }
.meta h3 { margin: 0; font-size: 15px; font-weight: 700; }
.meta .tag { font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--accent); }
.meta .desc { margin: 3px 0 0; color: var(--sub); font-size: 12.5px; line-height: 1.45; }
.num { font: 700 12px var(--display); color: var(--sub); border: 1px solid var(--line); border-radius: 8px; padding: 2px 7px; white-space: nowrap; }
.stage { display: flex; justify-content: center; }
.phone-box { width: calc(var(--z) * 300px); height: calc(var(--z) * 640px); position: relative; }
.phone { position: absolute; left: 0; top: 0; width: 300px; height: 640px; transform: scale(var(--z)); transform-origin: top left; border-radius: 40px; background: #0B0D11; padding: 9px; box-shadow: 0 18px 40px -18px rgba(10,20,40,.45); }
.actions { display: flex; gap: 6px; flex-wrap: wrap; }
.act { flex: 1 1 auto; border: 1px solid var(--line); background: transparent; color: var(--ink); border-radius: 10px; padding: 7px 8px; font: 600 12px var(--body); cursor: pointer; display: inline-flex; gap: 5px; align-items: center; justify-content: center; }
.act:hover { border-color: var(--accent); color: var(--accent); }
.act.danger:hover { border-color: var(--danger); color: var(--danger); }
.act.on { background: var(--fav); color: #111; border-color: var(--fav); }
.act.edit-on { background: var(--accent); color: #fff; border-color: var(--accent); }
.note { width: 100%; min-height: 54px; resize: vertical; border: 1px solid var(--line); border-radius: 10px; background: var(--bg); color: var(--ink); font: 13px var(--body); padding: 8px 10px; }
.empty { padding: 40px 0; color: var(--sub); text-align: center; }
.toast { position: fixed; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 10px 14px; border-radius: 12px; font: 600 13px var(--body); display: flex; gap: 12px; align-items: center; z-index: 30; }
.toast button { background: transparent; border: 0; color: var(--accent); font: 700 13px var(--body); cursor: pointer; }
.lb { position: fixed; inset: 0; z-index: 40; background: rgba(8,10,14,.82); display: flex; flex-direction: column; align-items: center; padding: calc(14px + env(safe-area-inset-top, 0px)) 16px calc(14px + env(safe-area-inset-bottom, 0px)); gap: 12px; }
.lb .bar { display: flex; gap: 8px; align-items: center; color: #fff; flex-wrap: wrap; justify-content: center; }
.lb .bar b { font-family: var(--display); margin-right: 8px; }
.lb .bar button { border: 1px solid rgba(255,255,255,.25); background: rgba(255,255,255,.08); color: #fff; border-radius: 10px; padding: 7px 11px; font: 600 13px var(--body); cursor: pointer; }
.lb .view { flex: 1; overflow: auto; width: 100%; display: flex; justify-content: center; align-items: flex-start; }
button:focus-visible, .tab:focus-visible, textarea:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* ---------- Telas do app (paleta própria, fixa, como o app no tema claro) ---------- */
.scr { --p: #0A84FF; --g: #22B573; --o: #FF7A1A; --r: #F2405D; --v: #8E5CF6; --y: #F5B70A; --c: #1E9BD7;
  --sbg: #F5F6F9; --sc: #FFFFFF; --st: #0E1116; --sm: #6B7280; --sl: #E7EAF0;
  width: 282px; height: 622px; border-radius: 32px; overflow: hidden; background: var(--sbg); color: var(--st); font: 13px/1.35 var(--body); position: relative; display: flex; flex-direction: column; }
.scr.dk { --sbg: #0D0F14; --sc: #181C24; --st: #F2F4F8; --sm: #8D96A5; --sl: #262C37; }
.scr [contenteditable="true"] { outline: 1px dashed var(--p); outline-offset: 1px; }
.sb { height: 30px; flex: none; display: flex; justify-content: space-between; align-items: center; padding: 6px 22px 0; font-weight: 700; font-size: 12px; }
.sb i { width: 74px; height: 20px; border-radius: 12px; background: #000; display: block; }
.bd { flex: 1; overflow: hidden; padding: 6px 14px 10px; display: flex; flex-direction: column; gap: 10px; }
.tb { height: 54px; flex: none; display: flex; justify-content: space-around; align-items: center; border-top: 1px solid var(--sl); background: var(--sc); padding-bottom: 6px; }
.tb span { display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 9px; color: var(--sm); font-weight: 600; }
.tb span.on { color: var(--p); }
.row { display: flex; align-items: center; gap: 8px; }
.col { display: flex; flex-direction: column; gap: 6px; }
.sp { justify-content: space-between; }
.f1 { flex: 1; min-width: 0; }
.cd { background: var(--sc); border-radius: 16px; padding: 12px; }
.cd.tight { padding: 9px 10px; }
.t1 { font: 800 21px/1.15 var(--body); letter-spacing: -.02em; }
.t2 { font: 800 16px/1.2 var(--body); letter-spacing: -.01em; }
.t3 { font-weight: 700; font-size: 13.5px; }
.mu { color: var(--sm); font-size: 11.5px; }
.xs { font-size: 10px; }
.big { font: 900 34px/1 var(--display); letter-spacing: -.03em; }
.mid { font: 800 20px/1 var(--display); }
.btn { background: var(--st); color: var(--sbg); border-radius: 12px; padding: 10px 14px; font-weight: 700; display: inline-flex; align-items: center; justify-content: center; gap: 7px; }
.btn.p { background: var(--p); color: #fff; }
.btn.g { background: var(--g); color: #fff; }
.btn.ghost { background: transparent; color: var(--st); border: 1.5px solid var(--sl); }
.btn.sm { padding: 6px 10px; font-size: 11.5px; border-radius: 10px; }
.pill { display: inline-flex; align-items: center; gap: 4px; padding: 3px 8px; border-radius: 999px; font-size: 10.5px; font-weight: 700; background: var(--sl); color: var(--st); }
.ic { width: 34px; height: 34px; border-radius: 11px; display: flex; align-items: center; justify-content: center; flex: none; color: #fff; }
.av { width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 800; color: #fff; background: var(--p); flex: none; }
.bar { height: 7px; border-radius: 99px; background: var(--sl); overflow: hidden; }
.bar > b { display: block; height: 100%; border-radius: 99px; background: var(--p); }
.g2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.g3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 7px; }
.g4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
.dots { display: flex; gap: 5px; }
.dot { width: 26px; height: 26px; border-radius: 50%; background: var(--sl); display: flex; align-items: center; justify-content: center; font-size: 10px; font-weight: 700; color: var(--sm); }
.dot.on { background: var(--o); color: #fff; }
.dot.today { box-shadow: 0 0 0 2px var(--p); }
.hr { height: 1px; background: var(--sl); }
.set { display: grid; grid-template-columns: 22px 1fr 44px 38px 26px; gap: 6px; align-items: center; font-weight: 600; }
.set .in { background: var(--sbg); border-radius: 8px; padding: 5px 0; text-align: center; }
.set .ok { width: 24px; height: 24px; border-radius: 7px; background: var(--sl); display: flex; align-items: center; justify-content: center; }
.set.done { background: color-mix(in srgb, var(--g) 14%, transparent); border-radius: 9px; }
.set.done .ok { background: var(--g); color: #fff; }
.ctr { text-align: center; align-items: center; }
.glow { box-shadow: 0 8px 22px -10px var(--p); }
</style>

<div class="wrap">
  <header class="top">
    <div class="brand"><h1>Reps Screen Lab</h1><p>50 versões de tela para escolher. Favorite, modifique os textos, duplique, apague e amplie.</p></div>

    <div class="tools">

      <button class="tbtn" id="reset-all" type="button"><span>Restaurar tudo</span></button>
    </div>
  </header>
  <section class="sec-intro" id="intro"></section>
  <main class="grid" id="grid"></main>
</div>
<div class="toast" id="toast" hidden role="status"></div>
<div class="lb" id="lb" hidden></div>
<script>
// Ícones de traço (24x24) desenhados aqui, sem biblioteca externa.
const P = {
  home: 'M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z',

  flame: 'M12 2c2 4 6 6 6 11a6 6 0 0 1-12 0c0-3 2-5 3-7 1 2 3 2 3-4z',

  target: 'M12 21a9 9 0 1 0 0-18 9 9 0 0 0 0 18zM12 16a4 4 0 1 0 0-8 4 4 0 0 0 0 8zM12 12h.01',

  users: 'M9 11a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7zM2 20a7 7 0 0 1 14 0M16 4a3.5 3.5 0 0 1 0 7M18 13a6 6 0 0 1 4 7',
  bell: 'M6 16v-5a6 6 0 0 1 12 0v5l2 2H4zM10 21h4',
  plus: 'M12 5v14M5 12h14',
  crown: 'M3 8l4 4 5-7 5 7 4-4-2 11H5z',
  medal: 'M8 2l4 7 4-7M12 21a5 5 0 1 0 0-10 5 5 0 0 0 0 10z',

  gift: 'M4 10h16v11H4zM2 7h20v3H2zM12 7v14M12 7S10 3 8 3 6 5 8 7M12 7s2-4 4-4 2 2 0 4',
  map: 'M9 4l6 2 6-2v16l-6 2-6-2-6 2V6zM9 4v16M15 6v16',

  spark: 'M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8z',
  swap: 'M7 7h13l-3-3M17 17H4l3 3',
  timer: 'M12 21a8 8 0 1 0 0-16 8 8 0 0 0 0 16zM12 9v4M9 2h6',
  body: 'M12 6a2 2 0 1 0 0-4 2 2 0 0 0 0 4zM5 9h14M12 9v6M9 22l3-7 3 7',
  gear: 'M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6zM12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M5 19l2-2M17 7l2-2',
  chev: 'M9 6l6 6-6 6',
  shield: 'M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z',

  trend: 'M3 17l6-6 4 4 8-8M15 7h6v6',
  mic: 'M12 15a3 3 0 0 0 3-3V6a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3zM5 11a7 7 0 0 0 14 0M12 18v3',
  list: 'M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01',
  book: 'M4 4h7a3 3 0 0 1 3 3v13a2 2 0 0 0-2-2H4zM20 4h-6M20 4v14h-6',
  sun: 'M12 17a5 5 0 1 0 0-10 5 5 0 0 0 0 10zM12 1v3M12 20v3M1 12h3M20 12h3',
  photo: 'M4 5h16v14H4zM4 15l5-5 4 4 3-3 4 4M15 9h.01',
  minus: 'M5 12h14',
  zz: 'M4 6h6l-6 6h6M14 4h6l-6 6h6',
  share: 'M12 3v13M7 8l5-5 5 5M5 14v6h14v-6',
  edit: 'M4 20h4L19 9l-4-4L4 16z',
  trash: 'M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13',
  expand: 'M4 9V4h5M20 15v5h-5M4 4l6 6M20 20l-6-6',
  copy: 'M8 8h12v12H8zM4 16V4h12',
  undo: 'M9 14L4 9l5-5M4 9h11a5 5 0 0 1 0 10h-3',
  x: 'M6 6l12 12M18 6L6 18',
};
const FILLED = new Set(['play', 'flame', 'star', 'bolt', 'crown', 'heart']);
function I(n, s = 16, c = 'currentColor', fill) {
  const f = fill ?? FILLED.has(n);
  return `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="${f ? c : 'none'}" stroke="${c}" stroke-width="${f ? 1.4 : 2}" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="${P[n]}"/></svg>`;
}
const ic = (n, bg, s = 34, is = 18) => `<span class="ic" style="width:${s}px;height:${s}px;background:${bg}">${I(n, is, '#fff')}</span>`;
const icSoft = (n, col, s = 34, is = 18) => `<span class="ic" style="width:${s}px;height:${s}px;background:color-mix(in srgb, ${col} 16%, transparent)">${I(n, is, col)}</span>`;

// Gráficos simples
function ring(pct, col, size = 64, w = 8, inner = '') {
  const r = (size - w) / 2, c = 2 * Math.PI * r;
  return `<span style="position:relative;width:${size}px;height:${size}px;display:inline-flex;align-items:center;justify-content:center;flex:none">
  <svg width="${size}" height="${size}" style="position:absolute;inset:0;transform:rotate(-90deg)"><circle cx="${size / 2}" cy="${size / 2}" r="${r}" fill="none" stroke="var(--sl)" stroke-width="${w}"/><circle cx="${size / 2}" cy="${size / 2}" r="${r}" fill="none" stroke="${col}" stroke-width="${w}" stroke-linecap="round" stroke-dasharray="${c * pct} ${c}"/></svg>
  <span style="position:relative;text-align:center;line-height:1.1">${inner}</span></span>`;
}
function rings(vals, size = 92) {
  const cols = ['var(--r)', 'var(--g)', 'var(--c)'];
  return `<span style="position:relative;width:${size}px;height:${size}px;display:inline-block;flex:none">${vals.map((v, i) => {
    const s = size - i * 22, w = 9, r = (s - w) / 2, c = 2 * Math.PI * r, o = i * 11;
    return `<svg width="${s}" height="${s}" style="position:absolute;left:${o}px;top:${o}px;transform:rotate(-90deg)"><circle cx="${s / 2}" cy="${s / 2}" r="${r}" fill="none" stroke="color-mix(in srgb, ${cols[i]} 22%, transparent)" stroke-width="${w}"/><circle cx="${s / 2}" cy="${s / 2}" r="${r}" fill="none" stroke="${cols[i]}" stroke-width="${w}" stroke-linecap="round" stroke-dasharray="${c * v} ${c}"/></svg>`;
  }).join('')}</span>`;
}
function bars(vals, col = 'var(--p)', h = 56, labels, hi = vals.length - 1) {
  const m = Math.max(...vals, 1);
  return `<div style="display:flex;align-items:flex-end;gap:5px;height:${h + (labels ? 14 : 0)}px">${vals.map((v, i) => `<div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:3px"><div style="width:100%;height:${Math.max(3, (v / m) * h)}px;border-radius:5px;background:${i === hi ? col : `color-mix(in srgb, ${col} 28%, transparent)`}"></div>${labels ? `<span class="xs mu">${labels[i]}</span>` : ''}</div>`).join('')}</div>`;
}
function line(vals, col = 'var(--p)', w = 250, h = 70, area = true, dotLast = true) {
  const mn = Math.min(...vals), mx = Math.max(...vals), rg = mx - mn || 1;
  const pts = vals.map((v, i) => [4 + (i * (w - 8)) / (vals.length - 1), 4 + (h - 8) * (1 - (v - mn) / rg)]);
  const d = pts.map((p, i) => `${i ? 'L' : 'M'}${p[0].toFixed(1)} ${p[1].toFixed(1)}`).join('');
  const lp = pts[pts.length - 1];
  return `<svg width="100%" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" style="display:block;height:${h}px">${area ? `<path d="${d}L${lp[0]} ${h}L4 ${h}Z" fill="${col}" opacity=".12"/>` : ''}<path d="${d}" fill="none" stroke="${col}" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke"/>${dotLast ? `<circle cx="${lp[0]}" cy="${lp[1]}" r="4" fill="${col}"/>` : ''}</svg>`;
}
function heat(weeks = 15, seed = 3, col = 'var(--g)') {
  let s = seed, out = '';
  for (let w = 0; w < weeks; w++) {
    out += '<div style="display:flex;flex-direction:column;gap:2px">';
    for (let d = 0; d < 7; d++) { s = (s * 9301 + 49297) % 233280; const v = s / 233280; const lv = v > .82 ? 1 : v > .62 ? .7 : v > .45 ? .4 : 0; out += `<i style="width:12px;height:12px;border-radius:3px;background:${lv ? `color-mix(in srgb, ${col} ${lv * 100}%, transparent)` : 'var(--sl)'}"></i>`; }
    out += '</div>';
  }
  return `<div style="display:flex;gap:2px">${out}</div>`;
}
function radar(vals, labels, col = 'var(--v)', size = 170) {
  const c = size / 2, R = size / 2 - 22, n = vals.length;
  const pt = (i, r) => [c + r * Math.sin((2 * Math.PI * i) / n), c - r * Math.cos((2 * Math.PI * i) / n)];
  const grid = [1, .66, .33].map((k) => `<polygon points="${vals.map((_, i) => pt(i, R * k).join(',')).join(' ')}" fill="none" stroke="var(--sl)"/>`).join('');
  const poly = `<polygon points="${vals.map((v, i) => pt(i, R * v).join(',')).join(' ')}" fill="${col}" fill-opacity=".22" stroke="${col}" stroke-width="2"/>`;
  const lab = labels.map((l, i) => { const [x, y] = pt(i, R + 13); return `<text x="${x}" y="${y + 3}" font-size="9" text-anchor="middle" fill="var(--sm)" font-weight="600">${l}</text>`; }).join('');
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">${grid}${poly}${lab}</svg>`;
}

// ===================== TREINO (registrar treino) =====================
const tr_top = (title, time, btn = 'Finalizar') => `<div class="row sp"><span class="row" style="gap:6px">${I('chev', 16, 'var(--sm)')}<div><b style="font-size:14px">${title}</b><div class="mu xs" style="color:var(--p)">${I('clock', 10, 'var(--p)')} ${time}</div></div></span><span class="btn sm g">${btn}</span></div>`;
const tr_head = () => `<div class="set mu xs" style="font-weight:700;letter-spacing:.04em"><span>SÉR</span><span>ANTERIOR</span><span class="ctr" style="text-align:center">KG</span><span style="text-align:center">REPS</span><span>${I('check', 12, 'var(--sm)')}</span></div>`;
const tr_set = (n, prev, kg, reps, done, tag) => `<div class="set${done ? ' done' : ''}" style="padding:3px 2px"><b style="text-align:center;color:${tag === 'A' ? 'var(--y)' : 'inherit'}">${tag || n}</b><span class="mu xs">${prev}</span><span class="in">${kg}</span><span class="in">${reps}</span><span class="ok">${I('check', 13, done ? '#fff' : 'var(--sm)')}</span></div>`;
const tr_step = (lbl, val, unit) => `<div class="col ctr" style="gap:4px"><span class="mu xs" style="font-weight:700;letter-spacing:.06em">${lbl}</span><div class="row" style="gap:10px"><span class="ic" style="width:40px;height:40px;border-radius:50%;background:var(--sl)">${I('minus', 18, 'var(--st)')}</span><span class="big" style="font-size:54px;min-width:84px;text-align:center">${val}</span><span class="ic" style="width:40px;height:40px;border-radius:50%;background:var(--p)">${I('plus', 18, '#fff')}</span></div><span class="mu xs">${unit}</span></div>`;
const tr_plateCol = { 25: '#F2405D', 20: '#0A84FF', 15: '#F5B70A', 10: '#22B573', 5: '#E9ECF1', 2.5: '#30343C' };
function tr_bar(side) {
  const H = { 25: 70, 20: 66, 15: 58, 10: 48, 5: 36, 2.5: 28 }, W = { 25: 12, 20: 11, 15: 10, 10: 9, 5: 7, 2.5: 6 };
  let x = 156, r = '', l = '';
  side.forEach((p) => { r += `<rect x="${x}" y="${45 - H[p] / 2}" width="${W[p]}" height="${H[p]}" rx="2.5" fill="${tr_plateCol[p]}" stroke="rgba(0,0,0,.18)"/>`; l += `<rect x="${250 - x - W[p]}" y="${45 - H[p] / 2}" width="${W[p]}" height="${H[p]}" rx="2.5" fill="${tr_plateCol[p]}" stroke="rgba(0,0,0,.18)"/>`; x += W[p] + 2; });
  return `<svg viewBox="0 0 250 90" width="100%" height="90"><rect x="6" y="42" width="238" height="6" rx="3" fill="#A7B0BE"/><rect x="88" y="39" width="74" height="12" rx="3" fill="#C4CAD4"/><rect x="150" y="36" width="5" height="18" rx="1.5" fill="#7C8594"/><rect x="95" y="36" width="5" height="18" rx="1.5" fill="#7C8594"/>${r}${l}</svg>`;
}
const tr_delta = (d) => { const up = d.startsWith('+'), eq = d === '='; const c = eq ? 'var(--sm)' : up ? 'var(--g)' : 'var(--r)'; return `<span class="pill" style="background:color-mix(in srgb, ${c} 18%, transparent);color:${c};min-width:44px;justify-content:center">${eq ? 'igual' : d}</span>`; };

const rt_grip = (c = 'var(--sm)') => `<svg width="10" height="16" viewBox="0 0 10 16" aria-hidden="true">${[2, 8, 14].map((y) => `<circle cx="2.5" cy="${y}" r="1.6" fill="${c}"/><circle cx="7.5" cy="${y}" r="1.6" fill="${c}"/>`).join('')}</svg>`;
const rt_slider = (label, icon, col, pct, val, lo, hi) => `<div class="col" style="gap:5px"><div class="row sp"><span class="row" style="gap:6px">${I(icon, 14, col)}<b style="font-size:12.5px">${label}</b></span><b class="xs" style="color:${col}">${val}</b></div><div style="position:relative;height:18px;display:flex;align-items:center"><div class="bar f1" style="height:6px"><b style="width:${pct}%;background:${col}"></b></div><span style="position:absolute;left:calc(${pct}% - 9px);width:18px;height:18px;border-radius:50%;background:#fff;border:3px solid ${col};box-shadow:0 2px 6px rgba(0,0,0,.15)"></span></div></div>`;
const rt_node = (n, c, sz, lb, sub, state) => `<div class="col ctr" style="gap:3px;width:96px"><span class="ic" style="width:${sz}px;height:${sz}px;border-radius:50%;background:${state === 'lock' ? 'var(--sl)' : c};box-shadow:${state === 'now' ? `0 0 0 4px color-mix(in srgb, ${c} 30%, transparent)` : 'none'}">${I(n, sz * 0.45, state === 'lock' ? 'var(--sm)' : '#fff')}</span><span class="col ctr" style="gap:1px;background:var(--sc);border-radius:6px;padding:1px 4px"><b style="font-size:11px;line-height:1.15;${state === 'lock' ? 'color:var(--sm)' : ''}">${lb}</b><span class="mu xs" style="line-height:1.2">${sub}</span></span></div>`;
const rt_proj = () => {
  const w = 250, h = 100, mn = 95, mx = 145;
  const y = (v) => (8 + (h - 16) * (1 - (v - mn) / (mx - mn))).toFixed(1);
  const hist = [100, 102.5, 105, 107.5, 107.5, 112.5, 115, 117.5, 120, 122.5];
  const step = 130 / (hist.length - 1);
  const hp = hist.map((v, i) => `${i ? 'L' : 'M'}${(6 + i * step).toFixed(1)} ${y(v)}`).join('');
  const x0 = 6 + 130, pj = [[x0, 122.5], [x0 + 38, 128.5], [x0 + 76, 134.5], [w - 8, 140]];
  const pp = pj.map((p, i) => `${i ? 'L' : 'M'}${p[0].toFixed(1)} ${y(p[1])}`).join('');
  return `<svg width="100%" viewBox="0 0 ${w} ${h}" style="display:block;height:${h}px">
    <line x1="0" x2="${w}" y1="${y(140)}" y2="${y(140)}" stroke="var(--g)" stroke-width="1.5" stroke-dasharray="4 4"/>
    <text x="4" y="${+y(140) - 4}" font-size="9" font-weight="700" fill="var(--g)">Meta 140 kg</text>
    <path d="${pp}L${w - 8} ${y(146)}L${x0} ${y(124)}Z" fill="var(--p)" opacity=".08"/>
    <path d="${hp}L${x0} ${h}L6 ${h}Z" fill="var(--p)" opacity=".12"/>
    <path d="${hp}" fill="none" stroke="var(--p)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="${pp}" fill="none" stroke="var(--p)" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="3 5"/>
    <circle cx="${x0}" cy="${y(122.5)}" r="4.5" fill="var(--p)" stroke="var(--sc)" stroke-width="2"/>
    <circle cx="${w - 8}" cy="${y(140)}" r="5" fill="var(--g)" stroke="var(--sc)" stroke-width="2"/>
    <text x="${x0}" y="${+y(122.5) + 16}" font-size="9" text-anchor="middle" font-weight="700" fill="var(--st)">hoje</text>
  </svg>`;
};

const st_mini = (lv, col) => `<div style="display:grid;grid-template-columns:repeat(7,1fr);gap:2px">${lv.map((v) => `<i style="height:7px;border-radius:2px;background:${v ? `color-mix(in srgb, ${col} ${v * 100}%, transparent)` : 'var(--sl)'}"></i>`).join('')}</div>`;
const st_back = (c = 'currentColor') => `<span style="display:inline-flex;transform:rotate(180deg)">${I('chev', 18, c)}</span>`;
const st_sil = (col, waist) => { const l = 50 - waist / 2, r = 50 + waist / 2; return `<svg viewBox="0 0 100 160" style="height:100%;display:block;margin:0 auto"><circle cx="50" cy="20" r="11" fill="${col}"/><path d="M42 33 Q50 37 58 33 L80 41 Q86 45 85 58 L82 90 Q${r} 98 ${r} 110 L${r + 3} 160 L53 160 L50 122 L47 160 L${l - 3} 160 L${l} 110 Q${l} 98 18 90 L15 58 Q14 45 20 41 Z" fill="${col}"/></svg>`; };
const st_stack = (weeks, cols, labels, h = 104) => { const m = Math.max(...weeks.map((w) => w.reduce((a, b) => a + b, 0))); return `<div style="display:flex;align-items:flex-end;gap:9px;height:${h + 14}px">${weeks.map((w, i) => `<div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:3px"><div style="width:100%;display:flex;flex-direction:column-reverse;gap:2px;opacity:${i === weeks.length - 1 ? 1 : .8}">${w.map((v, j) => `<i style="display:block;height:${(v / m) * (h - 10)}px;border-radius:4px;background:${cols[j]}"></i>`).join('')}</div><span class="xs ${i === weeks.length - 1 ? '' : 'mu'}" style="${i === weeks.length - 1 ? 'font-weight:800' : ''}">${labels[i]}</span></div>`).join('')}</div>`; };

const st_calGrid = () => {
  const lv = { 2: .7, 3: 1, 5: .45, 6: 1, 7: .7, 9: 1, 10: .7, 11: 1 }, rest = [1, 4, 8], plan = [13, 14, 16, 17];
  let out = ['D', 'S', 'T', 'Q', 'Q', 'S', 'S'].map((d) => `<span class="xs mu ctr" style="font-weight:700;display:block">${d}</span>`).join('');
  for (let d = 1; d <= 30; d++) {
    let st = 'background:transparent;color:var(--sm)', extra = '';
    if (lv[d]) st = `background:color-mix(in srgb, var(--g) ${lv[d] * 100}%, transparent);color:${lv[d] > .6 ? '#fff' : 'var(--st)'}`;
    if (rest.includes(d)) { st = 'background:var(--sl);color:var(--sm)'; extra = `<span style="position:absolute;bottom:2px;display:flex">${I('moon', 8, 'var(--sm)')}</span>`; }
    if (plan.includes(d)) extra = `<i style="position:absolute;bottom:3px;width:4px;height:4px;border-radius:50%;background:var(--p)"></i>`;
    if (d === 11) st = 'background:var(--p);color:#fff;box-shadow:0 4px 10px -4px var(--p)';
    if (d === 12) st = 'background:var(--sc);color:var(--p);box-shadow:inset 0 0 0 2px var(--p)';
    out += `<span style="position:relative;height:30px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:11.5px;${st}">${d}${extra}</span>`;
  }
  return `<div style="display:grid;grid-template-columns:repeat(7,1fr);gap:4px">${out}</div>`;
};

      <div style="margin-top:auto" class="col">${bars([3.1, 0, 4.2, 3.6, 0, 4.8, 2.7], '#fff', 62, ['S', 'T', 'Q', 'Q', 'S', 'S', 'D'], 5).replace(/class="xs mu"/g, 'class="xs" style="color:rgba(255,255,255,.8)"')}</div>
      <span class="pill" style="background:rgba(255,255,255,.2);color:#fff;align-self:flex-start">${I('trend', 11, '#fff')} +12% sobre a semana 45</span>
    </div>
    <div class="col" style="flex:none;width:228px;border-radius:22px;padding:18px 16px;background:linear-gradient(165deg,#F5B70A,#FF7A1A)">${I('trophy', 30, '#fff')}</div>
  </div>
  <div class="row" style="justify-content:center;gap:5px">${[0, 1, 0, 0, 0].map((a) => `<i style="height:6px;width:${a ? 18 : 6}px;border-radius:3px;background:${a ? 'var(--p)' : 'var(--sl)'}"></i>`).join('')}</div>
  <div class="row"><span class="btn ghost f1">${I('share', 13)} Compartilhar</span><span class="btn p f1">Próximo ${I('chev', 13, '#fff')}</span></div>
`, { tab: 3 }) });

V.push({ sec: 'stats', id: 's9', name: 'Volume e recuperação', tag: 'Recuperação', desc: 'Barras empilhadas mostram as séries de cada músculo por semana, e a lista de recuperação diz quem já está pronto e quem ainda precisa de horas. Abrir antes do treino vira costume.', html: () => screen(`
  ${hdr('Volume', st_seg(['Séries', 'kg'], 0).replace('padding:3px', 'padding:3px;width:96px'), 'Séries por músculo nas últimas 6 semanas')}
  <div class="cd col" style="gap:8px">${st_stack([[12, 14, 10, 8, 9], [14, 15, 8, 9, 10], [10, 13, 12, 8, 8], [15, 16, 6, 10, 11], [13, 17, 9, 9, 10], [16, 18, 6, 11, 12]], ['var(--r)', 'var(--p)', 'var(--o)', 'var(--v)', 'var(--c)'], ['S41', 'S42', 'S43', 'S44', 'S45', 'S46'], 100)}<div class="row" style="flex-wrap:wrap;gap:4px 10px;justify-content:center">${[['var(--r)', 'Peito'], ['var(--p)', 'Costas'], ['var(--o)', 'Pernas'], ['var(--v)', 'Ombros'], ['var(--c)', 'Braços']].map(([c, l]) => `<span class="row xs mu" style="gap:4px"><i style="width:8px;height:8px;border-radius:50%;background:${c}"></i>${l}</span>`).join('')}</div></div>
  <div class="cd col" style="gap:8px"><div class="row sp"><b>Recuperação agora</b><span class="mu xs">atualiza a cada treino</span></div>${[['Peito', 100, 'Recuperado', 'var(--g)'], ['Ombros', 92, 'Recuperado', 'var(--g)'], ['Costas', 58, 'Pronto amanhã', 'var(--o)'], ['Pernas', 34, 'Mais 30 h', 'var(--r)']].map(([m, p, s, c]) => `<div class="row"><span style="width:50px;font-weight:600;font-size:12px">${m}</span><div class="bar f1"><b style="width:${p}%;background:${c}"></b></div><span class="pill" style="width:88px;justify-content:center;background:color-mix(in srgb, ${c} 16%, transparent);color:${c}">${s}</span></div>`).join('')}</div>
  <div class="cd tight row">${icSoft('bolt', 'var(--g)', 30, 15)}<div class="f1"><b style="font-size:12px">Pronto hoje: Peito e Ombros</b><div class="mu xs">Push A leva 50 min</div></div><span class="btn p sm">${I('play', 10, '#fff')} Ir</span></div>
`, { tab: 3 }) });

V.push({ sec: 'stats', id: 's10', name: 'Descobertas automáticas', tag: 'Insights', desc: 'Um feed de frases escritas a partir dos treinos: o que melhorou, o melhor horário, o ponto fraco e previsões de quando o próximo marco chega. Cada semana traz descobertas novas para ler.', html: () => screen(`
  ${hdr('Descobertas', `<span class="pill" style="background:var(--p);color:#fff">3 novas</span>`, 'Escritas a partir dos seus 36 treinos')}
  <div class="cd col" style="gap:6px"><div class="row">${icSoft('trend', 'var(--g)', 30, 15)}<b class="f1" style="font-size:13px">Seu supino subiu 8% em 30 dias</b></div><div class="row" style="gap:10px"><span class="mu xs f1">De 104 para 112,5 kg de 1RM estimado. Mais rápido que 80% de quem treina há um ano.</span><div style="width:70px">${line([104, 105, 105.5, 107, 108.5, 110, 112.5], 'var(--g)', 70, 34)}</div></div></div>
  <div class="cd col" style="gap:6px"><div class="row">${icSoft('sun', 'var(--y)', 30, 15)}<b class="f1" style="font-size:13px">Você treina melhor às 7h</b>${st_delta('+11% volume', true)}</div>${bars([62, 100, 54, 70, 48], 'var(--y)', 30, ['6h', '7h', '12h', '18h', '21h'], 1)}</div>
  <div class="cd col" style="gap:7px;background:linear-gradient(135deg,color-mix(in srgb, var(--v) 16%, var(--sc)),var(--sc))"><div class="row">${ic('spark', 'var(--v)', 30, 15)}<div class="f1"><span class="mu xs">Previsão</span><div class="t3">Agachamento 145 kg × 5</div></div><b style="font:800 15px var(--display);color:var(--v)">~3 sem.</b></div><div class="bar"><b style="width:82%;background:var(--v)"></b></div><span class="mu xs">Mantendo 2 treinos de pernas por semana.</span></div>
  <div class="cd tight row">${icSoft('cal', 'var(--r)', 30, 15)}<div class="f1"><b style="font-size:12px">Sexta é seu ponto fraco</b><div class="mu xs">Pulou 4 das últimas 6</div></div><span class="btn ghost sm">Mudar dia</span></div>
`, { tab: 3 }) });

// ===================== Galeria: seções, favoritos, edição, duplicar, lixeira, zoom =====================
const SECS = [
  { k: 'home', h: 'inicio', t: 'Início', d: 'A primeira tela do app. Cada versão aposta num motivo diferente para a pessoa abrir o Reps todo dia: sequência, nível, jornada, coach, liga.' },
  { k: 'treino', h: 'treino', t: 'Treino', d: 'Onde a pessoa registra as séries. Do modo clássico em tabela ao modo jogo com combo de XP, passando pelo guiado para iniciantes.' },
  { k: 'trainer', h: 'trainer', t: 'Trainer', d: 'O programa personalizado. Versões que mostram o plano, explicam o porquê e recompensam quem segue o ciclo até o fim.' },
  { k: 'perfil', h: 'perfil', t: 'Perfil', d: 'Quem a pessoa é no app: nível, conquistas, força por exercício e metas. Do perfil gamer ao minimalista.' },
  { k: 'stats', h: 'progresso', t: 'Progresso', d: 'Aba nova só para números: calendário, medidas, exercícios, fotos, recordes e relatórios. Onde o avanço fica visível e vira motivo para voltar.' },
  { k: 'fav', h: 'favoritos', t: 'Favoritos', d: 'As versões que você marcou com estrela, de todas as seções.' },
  { k: 'trash', h: 'lixeira', t: 'Lixeira', d: 'Versões apagadas. Restaure ou apague de vez.' },
];
const KEY = 'reps-lab-v1';
let S = { zoom: 0.9, fav: [], del: [], gone: [], notes: {}, edits: {}, copies: [] };
try { const raw = localStorage.getItem(KEY); if (raw) S = { ...S, ...JSON.parse(raw) }; } catch (e) { /* sem armazenamento: tudo vale só nesta visita */ }
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) { /* ignora */ } };

const all = () => [...V, ...S.copies.map((c) => ({ ...c, html: () => c.snap }))];
const find = (id) => all().find((v) => v.id === id);
const num = (v) => { const list = all().filter((x) => x.sec === v.sec); return list.indexOf(v) + 1; };
const htmlOf = (v) => S.edits[v.id] ?? v.html();
let cur = 'home', editing = null, lastDel = null;

const $ = (s, el = document) => el.querySelector(s);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);

function renderTabs() {
  $('#tabs').innerHTML = SECS.map((s) => {
    const n = s.k === 'fav' ? S.fav.filter((id) => find(id) && !S.del.includes(id)).length : s.k === 'trash' ? S.del.filter(find).length : all().filter((v) => v.sec === s.k && !S.del.includes(v.id) && !S.gone.includes(v.id)).length;
    return `<button class="tab" role="tab" aria-selected="${cur === s.k}" data-k="${s.k}">${s.t}<span class="n">${n}</span></button>`;
  }).join('');
}

function card(v) {
  const inTrash = S.del.includes(v.id), fav = S.fav.includes(v.id), ed = editing === v.id;
  const sec = SECS.find((s) => s.k === v.sec);
  const acts = inTrash
    ? `<button class="act" data-a="restore" data-id="${v.id}">${I('undo', 14)}Restaurar</button><button class="act danger" data-a="purge" data-id="${v.id}">${I('trash', 14)}Apagar de vez</button>`
    : `<button class="act${fav ? ' on' : ''}" data-a="fav" data-id="${v.id}" aria-pressed="${fav}">${I('star', 14, fav ? '#111' : 'currentColor', fav)}${fav ? 'Favorita' : 'Favoritar'}</button>
       <button class="act${ed ? ' edit-on' : ''}" data-a="edit" data-id="${v.id}">${I(ed ? 'check' : 'edit', 14)}${ed ? 'Salvar' : 'Modificar'}</button>
       <button class="act" data-a="zoom" data-id="${v.id}">${I('expand', 14)}Ampliar</button>
       <button class="act" data-a="dup" data-id="${v.id}">${I('copy', 14)}Duplicar</button>
       ${S.edits[v.id] ? `<button class="act" data-a="reset" data-id="${v.id}">${I('undo', 14)}Original</button>` : ''}
       <button class="act danger" data-a="del" data-id="${v.id}">${I('trash', 14)}Apagar</button>`;
  return `<article class="card${fav ? ' fav' : ''}${ed ? ' editing' : ''}" id="c-${v.id}">
    <div class="meta"><div><div class="tag">${esc(v.tag)}${cur === 'fav' || cur === 'trash' ? ` · ${sec.t}` : ''}${v.copy ? ' · cópia' : ''}</div><h3>${esc(v.name)}</h3><p class="desc">${esc(v.desc)}</p></div><span class="num">${sec.t[0]}${num(v)}</span></div>
    <div class="stage"><div class="phone-box"><div class="phone" data-screen="${v.id}">${htmlOf(v)}</div></div></div>
    ${ed ? `<p class="desc" style="margin:0">Toque nos textos da tela para mudar. Depois toque em Salvar.</p>` : ''}
    <div class="actions">${acts}</div>
    ${inTrash ? '' : `<textarea class="note" id="note-${v.id}" data-note="${v.id}" placeholder="Anotações: o que gostou, o que mudaria...">${esc(S.notes[v.id] ?? '')}</textarea>`}
  </article>`;
}

function render() {
  const sec = SECS.find((s) => s.k === cur);
  let list;
  if (cur === 'fav') list = S.fav.map(find).filter((v) => v && !S.del.includes(v.id));
  else if (cur === 'trash') list = S.del.map(find).filter(Boolean);
  else list = all().filter((v) => v.sec === cur && !S.del.includes(v.id) && !S.gone.includes(v.id));
  $('#intro').innerHTML = `<h2>${sec.t}</h2><p>${sec.d}</p>`;
  $('#grid').innerHTML = list.length ? list.map(card).join('') : `<div class="empty">${cur === 'fav' ? 'Nenhuma favorita ainda. Toque na estrela de uma versão para guardar aqui.' : cur === 'trash' ? 'A lixeira está vazia.' : 'Todas as versões desta seção foram apagadas. Veja a Lixeira para restaurar.'}</div>`;
  if (editing) { const el = $(`[data-screen="${editing}"] .scr`); if (el) el.querySelectorAll('.bd *').forEach((n) => { if (n.children.length === 0 && n.textContent.trim()) n.contentEditable = 'true'; }); }
  renderTabs();
}

function toast(msg, undo) {
  const t = $('#toast');
  t.innerHTML = `<span>${msg}</span>${undo ? '<button id="undo">Desfazer</button>' : ''}`;
  t.hidden = false;
  clearTimeout(toast.t); toast.t = setTimeout(() => { t.hidden = true; }, 4000);
  if (undo) $('#undo').onclick = () => { undo(); t.hidden = true; };
}

function stopEdit() {
  if (!editing) return;
  const el = $(`[data-screen="${editing}"]`);
  if (el) { el.querySelectorAll('[contenteditable]').forEach((n) => n.removeAttribute('contenteditable')); S.edits[editing] = el.innerHTML; save(); }
  editing = null;
}

document.addEventListener('click', (e) => {
  const tab = e.target.closest('.tab');
  if (tab) { stopEdit(); go(tab.dataset.k); return; }
  const b = e.target.closest('.act'); if (!b) return;
  const id = b.dataset.id, a = b.dataset.a, v = find(id);
  if (a === 'fav') { S.fav = S.fav.includes(id) ? S.fav.filter((x) => x !== id) : [...S.fav, id]; save(); render(); }
  if (a === 'edit') { if (editing === id) { stopEdit(); toast('Modificação salva'); } else { stopEdit(); editing = id; } render(); }
  if (a === 'reset') { delete S.edits[id]; save(); render(); toast('Voltou ao original'); }
  if (a === 'dup') {
    stopEdit();
    const cid = `${id.split('-c')[0]}-c${Date.now().toString(36)}`;
    S.copies.push({ id: cid, sec: v.sec, name: `${v.name} (cópia)`, tag: v.tag, desc: v.desc, copy: true, snap: htmlOf(v) });
    save(); render(); toast('Cópia criada no fim da seção'); $(`#c-${cid}`)?.scrollIntoView({ behavior: 'smooth', block: 'center' });
  }
  if (a === 'del') { stopEdit(); S.del = [...S.del, id]; lastDel = id; save(); render(); toast(`"${esc(v.name)}" foi para a Lixeira`, () => { S.del = S.del.filter((x) => x !== lastDel); save(); render(); }); }
  if (a === 'restore') { S.del = S.del.filter((x) => x !== id); save(); render(); toast('Restaurada'); }
  if (a === 'purge') { S.del = S.del.filter((x) => x !== id); S.copies = S.copies.filter((c) => c.id !== id); if (!v.copy) S.gone = [...S.gone, id]; S.fav = S.fav.filter((x) => x !== id); save(); render(); toast('Apagada de vez'); }
  if (a === 'zoom') openLb(id);
});
document.addEventListener('input', (e) => { const id = e.target.dataset?.note; if (id) { S.notes[id] = e.target.value; save(); } });

// Ampliar
let lbZ = 1.6, lbId = null;
function openLb(id) {
  lbId = id; const v = find(id), list = all().filter((x) => x.sec === v.sec && !S.del.includes(x.id) && !S.gone.includes(x.id));
  const i = list.indexOf(v);
  $('#lb').hidden = false;
  $('#lb').innerHTML = `<div class="bar"><b>${esc(v.name)}</b><button data-lb="prev"${i <= 0 ? ' disabled' : ''}>Anterior</button><button data-lb="out">Menos zoom</button><span>${Math.round(lbZ * 100)}%</span><button data-lb="in">Mais zoom</button><button data-lb="next"${i >= list.length - 1 ? ' disabled' : ''}>Próxima</button><button data-lb="close">Fechar</button></div>
    <div class="view"><div class="phone-box" style="--z:${lbZ}"><div class="phone">${htmlOf(v)}</div></div></div>`;
  $('#lb').dataset.prev = list[i - 1]?.id ?? ''; $('#lb').dataset.next = list[i + 1]?.id ?? '';
}
document.addEventListener('click', (e) => {
  const b = e.target.closest('[data-lb]'); if (!b) return;
  const k = b.dataset.lb, lb = $('#lb');
  if (k === 'close') lb.hidden = true;
  if (k === 'in') { lbZ = Math.min(3, lbZ + 0.2); openLb(lbId); }
  if (k === 'out') { lbZ = Math.max(0.6, lbZ - 0.2); openLb(lbId); }
  if (k === 'prev' && lb.dataset.prev) openLb(lb.dataset.prev);
  if (k === 'next' && lb.dataset.next) openLb(lb.dataset.next);
});
document.addEventListener('keydown', (e) => {
  if ($('#lb').hidden) return;
  if (e.key === 'Escape') $('#lb').hidden = true;
  if (e.key === 'ArrowRight' && $('#lb').dataset.next) openLb($('#lb').dataset.next);
  if (e.key === 'ArrowLeft' && $('#lb').dataset.prev) openLb($('#lb').dataset.prev);
});

// Zoom geral, favoritos, restaurar tudo
const zr = $('#zoom');
const applyZoom = () => { document.documentElement.style.setProperty('--z', S.zoom); $('#zv').textContent = `${Math.round(S.zoom * 100)}%`; zr.value = S.zoom; };
zr.addEventListener('input', () => { S.zoom = Number(zr.value); applyZoom(); save(); });
$('#reset-all').addEventListener('click', () => {
  if (!$('#reset-all').dataset.armed) { $('#reset-all').dataset.armed = '1'; $('#reset-all').lastChild.textContent = 'Toque de novo para confirmar'; setTimeout(() => { delete $('#reset-all').dataset.armed; $('#reset-all').lastChild.textContent = 'Restaurar tudo'; }, 3000); return; }
  delete $('#reset-all').dataset.armed; $('#reset-all').lastChild.textContent = 'Restaurar tudo';
  S = { zoom: S.zoom, fav: [], del: [], gone: [], notes: {}, edits: {}, copies: [] }; editing = null; save(); render(); toast('Tudo voltou ao original');
});

function go(k) { cur = k; const h = SECS.find((s) => s.k === k).h; if (location.hash !== `#${h}`) history.replaceState(null, '', `#${h}`); render(); window.scrollTo({ top: 0 }); }
const fromHash = () => SECS.find((s) => `#${s.h}` === location.hash)?.k ?? 'home';
window.addEventListener('hashchange', () => { cur = fromHash(); render(); });
applyZoom(); cur = fromHash(); render();

</script>

</body></html>
