<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Reps icon generator</title>
<style>
  body { margin: 0; font: 13px system-ui, sans-serif; background: #e9ebef; color: #222; }
  header { padding: 10px 16px; display: flex; gap: 12px; align-items: center; }
  #grid { display: grid; grid-template-columns: repeat(auto-fill, 128px); gap: 10px; padding: 12px 16px; }
  .cell { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 8px 4px; border-radius: 10px; }
  .cell.dark { background: #232731; color: #ddd; }
  .cell.light { background: #fff; }
  .cell img { width: 96px; height: 96px; }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
</head>
<body>
<header><b>Reps 3D icons</b><span id="status">loading…</span></header>
<div id="grid"></div>
<script type="module" src="gen.js"></script>
</body>
</html>
